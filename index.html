<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAASTORE</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen pb-12">
  <div class="container mx-auto px-4 py-8">
    
    <!-- Header -->
    <header class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
      <h1 class="text-3xl font-bold text-amber-400 tracking-wider">TAASTORE</h1>
      <button id="admin-btn" onclick="toggleAdminPanel()" class="bg-slate-800 hover:bg-slate-700 text-xs text-slate-400 px-3 py-2 rounded border border-slate-700">Admin Login</button>
    </header>

    <!-- Banner Promosi -->
    <div class="mb-8 p-6 bg-gradient-to-r from-amber-500/20 via-slate-800 to-slate-800 rounded-2xl border border-amber-500/30 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-xl">
      <div>
        <span class="bg-amber-500 text-slate-950 font-extrabold text-[10px] px-2.5 py-1 rounded-full uppercase tracking-wider">PROMO SPESIAL</span>
        <h2 class="text-xl font-bold text-white mt-2">Gems & Items Ready Stock!</h2>
        <p class="text-slate-400 text-sm">Transaksi cepat, aman, dan terpercaya 24/7 via WhatsApp CS.</p>
      </div>
      <div class="text-xs text-amber-400 bg-amber-500/10 px-3 py-2 rounded-lg border border-amber-500/20">
        ⚡ Garansi Proses Cepat
      </div>
    </div>

    <!-- Panel Admin -->
    <section id="admin-panel" class="hidden mb-10 bg-slate-800 p-6 rounded-xl border border-amber-500/50 shadow-2xl">
      <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
        <h2 class="text-lg font-bold text-amber-400">Panel Manajemen Produk (Protected)</h2>
        <button onclick="logoutAdmin()" class="text-xs bg-rose-900 text-rose-300 px-2.5 py-1 rounded hover:bg-rose-800">Logout Admin</button>
      </div>

      <form id="item-form" onsubmit="saveItem(event)" class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6">
        <input type="hidden" id="item-id">
        <input type="text" id="item-name" placeholder="Nama Produk" required class="bg-slate-900 border border-slate-700 p-2.5 rounded text-sm focus:outline-none focus:border-amber-400">
        <input type="number" id="item-price" placeholder="Harga (Rp)" required class="bg-slate-900 border border-slate-700 p-2.5 rounded text-sm focus:outline-none focus:border-amber-400">
        <input type="url" id="item-image" placeholder="Image URL (e.g. https://...)" class="bg-slate-900 border border-slate-700 p-2.5 rounded text-sm focus:outline-none focus:border-amber-400">
        
        <select id="item-type" class="bg-slate-900 border border-slate-700 p-2.5 rounded text-sm focus:outline-none focus:border-amber-400">
          <option value="beli">BELI</option>
          <option value="jual">JUAL</option>
        </select>
        <select id="item-status" class="bg-slate-900 border border-slate-700 p-2.5 rounded text-sm focus:outline-none focus:border-amber-400">
          <option value="ready">Ready</option>
          <option value="limited">Limited</option>
          <option value="empty">Out of Stock</option>
        </select>
        
        <div class="flex gap-2 col-span-1 md:col-span-3">
          <button type="submit" id="form-btn" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold p-2.5 rounded text-sm">Tambah Produk</button>
          <button type="button" onclick="resetForm()" class="bg-slate-700 text-slate-300 p-2.5 rounded text-sm">Batal</button>
        </div>
      </form>
    </section>

    <!-- Search & Filter -->
    <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
      <div class="w-full md:w-1/3">
        <input type="text" id="search-input" oninput="filterProducts()" placeholder="🔍 Cari nama produk..." class="w-full bg-slate-800 border border-slate-700 px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:border-amber-400">
      </div>
      <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-1">
        <button onclick="setFilter('all')" id="filter-all" class="filter-btn active-filter bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-lg text-xs transition">Semua</button>
        <button onclick="setFilter('beli')" id="filter-beli" class="filter-btn bg-slate-800 text-slate-300 hover:bg-slate-700 px-4 py-2 rounded-lg text-xs transition">Katalog Beli</button>
        <button onclick="setFilter('jual')" id="filter-jual" class="filter-btn bg-slate-800 text-slate-300 hover:bg-slate-700 px-4 py-2 rounded-lg text-xs transition">Katalog Jual</button>
      </div>
    </div>

    <!-- Main Content -->
    <main>
      <div id="loading" class="text-slate-400 py-8 text-center">Memuat data barang...</div>
      <div id="product-list" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </main>
  </div>

  <!-- Modal Checkout Form -->
  <div id="cart-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3 mb-4">
        <h3 class="font-bold text-lg text-amber-400" id="cart-item-name">Detail Pesanan</h3>
        <button onclick="closeCartModal()" class="text-slate-400 hover:text-white text-lg">✕</button>
      </div>
      
      <form onsubmit="sendToWA(event)" class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-slate-400 mb-1 block">Harga Satuan</label>
            <div class="text-base font-bold text-white" id="cart-item-price">Rp 0</div>
          </div>
          <div>
            <label class="text-xs text-slate-400 mb-1 block">Jumlah / Qty</label>
            <input type="number" id="cart-qty" min="1" value="1" oninput="calculateTotal()" required class="w-full bg-slate-900 border border-slate-700 p-2 rounded-lg text-white text-sm focus:outline-none focus:border-amber-400">
          </div>
        </div>

        <div>
          <label class="text-xs text-slate-400 mb-1 block">Nama Pembeli</label>
          <input type="text" id="buyer-name" placeholder="Masukkan nama kamu" required class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-white text-sm focus:outline-none focus:border-amber-400">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-slate-400 mb-1 block">GrowID / ID Game</label>
            <input type="text" id="buyer-game-id" placeholder="Contoh: Azka07" required class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-white text-sm focus:outline-none focus:border-amber-400">
          </div>
          <div>
            <label class="text-xs text-slate-400 mb-1 block">World Name</label>
            <input type="text" id="buyer-world" placeholder="Contoh: TAASTORE" required class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-white text-sm focus:outline-none focus:border-amber-400">
          </div>
        </div>

        <div>
          <label class="text-xs text-slate-400 mb-1 block">Metode Pembayaran</label>
          <select id="buyer-payment" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-white text-sm focus:outline-none focus:border-amber-400">
            <option value="QRIS">QRIS All Payment</option>
            <option value="BCA">Bank BCA</option>
            <option value="DANA">DANA</option>
            <option value="GOPAY">GoPay</option>
            <option value="Seabank">Seabank</option>
          </select>
        </div>

        <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-700/50 mt-2">
          <div class="text-xs text-slate-400 mb-0.5">Total Pembayaran:</div>
          <div class="text-2xl font-black text-amber-400" id="cart-total-price">Rp 0</div>
        </div>

        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition mt-2">
          Kirim Pesanan ke WhatsApp CS
        </button>
      </form>
    </div>
  </div>

  <script>
    const API_URL = "https://taastore-backend.vercel.app";
    let isAdmin = false;
    let adminKey = "";
    let itemsData = [];
    let activeFilter = 'all';
    let selectedItem = null;

    async function loadItems() {
      try {
        const response = await fetch(`${API_URL}/items`);
        itemsData = await response.json();
        filterProducts();
      } catch (err) {
        document.getElementById("loading").innerText = "Gagal memuat barang. Cek koneksi backend.";
        document.getElementById("loading").className = "text-rose-500 text-center py-8";
      }
    }

    function setFilter(type) {
      activeFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.className = "filter-btn bg-slate-800 text-slate-300 hover:bg-slate-700 px-4 py-2 rounded-lg text-xs transition";
      });
      document.getElementById(`filter-${type}`).className = "filter-btn active-filter bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-lg text-xs transition";
      filterProducts();
    }

    function filterProducts() {
      const searchKeyword = document.getElementById("search-input").value.toLowerCase();
      const filtered = itemsData.filter(item => {
        const matchSearch = item.name.toLowerCase().includes(searchKeyword);
        const matchType = activeFilter === 'all' || item.type === activeFilter;
        return matchSearch && matchType;
      });
      renderProducts(filtered);
    }

    function renderProducts(data) {
      const container = document.getElementById("product-list");
      const loading = document.getElementById("loading");
      loading.classList.add("hidden");
      container.innerHTML = "";

      if (data.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-8 text-slate-500">Tidak ada produk ditemukan.</div>`;
        return;
      }

      data.forEach(item => {
        const card = document.createElement("div");
        card.className = "bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg flex flex-col justify-between relative overflow-hidden";

        let stockBadge = `<span class="bg-emerald-900/80 text-emerald-300 border border-emerald-700/50 text-[10px] font-bold px-2 py-0.5 rounded">READY</span>`;
        let isOut = false;
        
        if (item.stock_status === 'limited') {
          stockBadge = `<span class="bg-amber-900/80 text-amber-300 border border-amber-700/50 text-[10px] font-bold px-2 py-0.5 rounded">LIMITED</span>`;
        } else if (item.stock_status === 'empty') {
          stockBadge = `<span class="bg-rose-900/80 text-rose-300 border border-rose-700/50 text-[10px] font-bold px-2 py-0.5 rounded">OUT OF STOCK</span>`;
          isOut = true;
        }

        const imageHtml = item.image_url 
          ? `<img src="${item.image_url}" alt="${item.name}" class="w-full h-36 object-cover rounded-lg mb-3 bg-slate-900">`
          : '';

        card.innerHTML = `
          <div>
            ${imageHtml}
            <div class="flex justify-between items-start mb-2">
              <h3 class="text-lg font-bold text-white">${item.name}</h3>
              <div class="flex gap-1.5 items-center">
                ${stockBadge}
                <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded ${item.type === 'beli' ? 'bg-blue-900/80 text-blue-300 border border-blue-700/50' : 'bg-purple-900/80 text-purple-300 border border-purple-700/50'}">${item.type}</span>
              </div>
            </div>
            <p class="text-2xl font-extrabold text-amber-400 mb-4">Rp ${item.price.toLocaleString('id-ID')}</p>
          </div>

          <div>
            <button onclick="openCartModal(${item.id})" ${isOut ? 'disabled' : ''} class="w-full text-center ${isOut ? 'bg-slate-700 text-slate-500 cursor-not-allowed' : 'bg-amber-500 hover:bg-amber-600 text-slate-950'} font-bold py-2.5 px-4 rounded-lg transition duration-200">
              ${isOut ? 'Stok Habis' : 'Beli Sekarang'}
            </button>
            ${isAdmin ? `
              <div class="flex gap-2 mt-3 pt-3 border-t border-slate-700">
                <button onclick="editItem(${item.id})" class="flex-1 bg-blue-600 hover:bg-blue-500 text-xs py-1.5 rounded font-medium">Edit</button>
                <button onclick="deleteItem(${item.id})" class="flex-1 bg-rose-600 hover:bg-rose-500 text-xs py-1.5 rounded font-medium">Hapus</button>
              </div>
            ` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openCartModal(id) {
      selectedItem = itemsData.find(i => i.id === id);
      if (!selectedItem) return;

      document.getElementById("cart-item-name").innerText = selectedItem.name;
      document.getElementById("cart-item-price").innerText = `Rp ${selectedItem.price.toLocaleString('id-ID')}`;
      document.getElementById("cart-qty").value = 1;
      calculateTotal();

      document.getElementById("cart-modal").classList.remove("hidden");
    }

    function closeCartModal() {
      document.getElementById("cart-modal").classList.add("hidden");
      selectedItem = null;
    }

    function calculateTotal() {
      if (!selectedItem) return;
      const qty = parseInt(document.getElementById("cart-qty").value) || 1;
      const total = selectedItem.price * qty;
      document.getElementById("cart-total-price").innerText = `Rp ${total.toLocaleString('id-ID')}`;
    }

    function sendToWA(e) {
      e.preventDefault();
      if (!selectedItem) return;

      const qty = parseInt(document.getElementById("cart-qty").value) || 1;
      const total = selectedItem.price * qty;
      const buyerName = document.getElementById("buyer-name").value;
      const gameId = document.getElementById("buyer-game-id").value;
      const world = document.getElementById("buyer-world").value;
      const payment = document.getElementById("buyer-payment").value;

      const textMessage = 
`🛒 *FORM PESANAN TAASTORE*
----------------------------------------
• *Nama Pembeli*: ${buyerName}
• *Produk*: ${selectedItem.name}
• *Jumlah*: ${qty}x
• *Total Harga*: Rp ${total.toLocaleString('id-ID')}
• *GrowID / ID Game*: ${gameId}
• *World Name*: ${world}
• *Metode Bayar*: ${payment}
----------------------------------------
Mohon diproses min, terima kasih! 🙏`;

      const waText = encodeURIComponent(textMessage);
      window.open(`https://wa.me/6282123602358?text=${waText}`, '_blank');
      closeCartModal();
    }

    function toggleAdminPanel() {
      if (!isAdmin) {
        const inputPassword = prompt("Masukkan Password Admin TAASTORE:");
        if (inputPassword === "TAASTORE.ID") {
          isAdmin = true;
          adminKey = inputPassword;
          document.getElementById("admin-panel").classList.remove("hidden");
          document.getElementById("admin-btn").innerText = "Admin Active";
          document.getElementById("admin-btn").className = "bg-emerald-800 text-emerald-200 text-xs px-3 py-2 rounded border border-emerald-600 font-bold";
          filterProducts();
        } else if (inputPassword) {
          alert("Password Salah!");
        }
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      adminKey = "";
      document.getElementById("admin-panel").classList.add("hidden");
      document.getElementById("admin-btn").innerText = "Admin Login";
      document.getElementById("admin-btn").className = "bg-slate-800 hover:bg-slate-700 text-xs text-slate-400 px-3 py-2 rounded border border-slate-700";
      resetForm();
      filterProducts();
    }

    function editItem(id) {
      const item = itemsData.find(i => i.id === id);
      if (item) {
        document.getElementById("item-id").value = item.id;
        document.getElementById("item-name").value = item.name;
        document.getElementById("item-price").value = item.price;
        document.getElementById("item-image").value = item.image_url || "";
        document.getElementById("item-type").value = item.type;
        document.getElementById("item-status").value = item.stock_status || "ready";
        document.getElementById("form-btn").innerText = "Simpan Perubahan";
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    async function saveItem(e) {
      e.preventDefault();
      const id = document.getElementById("item-id").value;
      const name = document.getElementById("item-name").value;
      const price = parseFloat(document.getElementById("item-price").value);
      const image_url = document.getElementById("item-image").value;
      const type = document.getElementById("item-type").value;
      const stock_status = document.getElementById("item-status").value;

      const payload = { name, price, image_url, type, stock_status };

      const headers = {
        "Content-Type": "application/json",
        "x-admin-key": adminKey
      };

      if (id) {
        await fetch(`${API_URL}/items/${id}`, {
          method: "PUT",
          headers: headers,
          body: JSON.stringify(payload)
        });
      } else {
        await fetch(`${API_URL}/items`, {
          method: "POST",
          headers: headers,
          body: JSON.stringify(payload)
        });
      }

      resetForm();
      loadItems();
    }

    async function deleteItem(id) {
      if (confirm("Yakin ingin menghapus produk ini?")) {
        await fetch(`${API_URL}/items/${id}`, {
          method: "DELETE",
          headers: { "x-admin-key": adminKey }
        });
        loadItems();
      }
    }

    function resetForm() {
      document.getElementById("item-id").value = "";
      document.getElementById("item-name").value = "";
      document.getElementById("item-price").value = "";
      document.getElementById("item-image").value = "";
      document.getElementById("item-type").value = "beli";
      document.getElementById("item-status").value = "ready";
      document.getElementById("form-btn").innerText = "Tambah Produk";
    }

    loadItems();
  </script>
</body>
</html>
